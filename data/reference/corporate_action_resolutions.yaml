resolutions:
  - event_id: NSE_CA_001069
    symbol: LAKSHVILAS
    event_date: 2006-11-17
    resolution_type: COMPOSITE_BONUS_RIGHTS
    review_status: APPROVED
    resolved_event_type: BONUS_RIGHTS_COMPOSITE
    resolved_price_factor: 0.5222493888
    resolved_share_factor: 2.5
    bonus_ratio: 0.5
    rights_ratio: 1.0
    rights_subscription_price: 50.0
    post_share_count_per_old_share: 2.5
    cash_contribution_per_old_share: 50.0
    rights_entitlement_basis: OLD_SHARES_EXCLUDES_BONUS
    factor_quality: OFFICIAL_TERMS_COMPOSITE_RESOLVED
    review_classification: RESOLVED_COMPOSITE_ACTION
    classification_confidence: HIGH
    evidence_references:
      - CAE_LAKSHVILAS_20061117_01
      - CAE_LAKSHVILAS_20061117_02
    rationale: >
      Reviewed terms show one bonus share for every two old shares plus one rights
      share for every one old share at Rs 50. Rights entitlement applies to old
      shares and excludes bonus shares. Price-return adjustment uses the
      cash-aware theoretical ex-price formula.
