[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-active-universe"
version = "0.1.0"
description = "Point-in-time historical Indian cash-equity security master and active universe"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14", "duckdb>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
india-equity-data = "india_active_universe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
