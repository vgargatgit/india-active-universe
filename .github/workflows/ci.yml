name: ci

on:
  push:
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[data,dev]'
      - run: PYTHONPATH=.:src pytest -q --junitxml=test-results.xml
      - run: PYTHONPATH=.:src python scripts/validate_pit.py
      - run: PYTHONPATH=.:src python scripts/validate_manual_identity_overrides.py --input data/reference/manual_identity_overrides.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results
          path: test-results.xml
