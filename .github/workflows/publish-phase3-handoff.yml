name: publish-phase3-handoff

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Canonical Phase 3 release ID to publish
        required: true
        default: india_equity_data_v2.2.9
      release_dir:
        description: Materialized release directory
        required: true
        default: releases/india_equity_data_v2.2.9
      evidence_dir:
        description: Build/audit evidence directory
        required: true
        default: reports

permissions:
  contents: write

concurrency:
  group: publish-phase3-handoff
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Require a complete audited release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_DIR: ${{ inputs.release_dir }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from india_active_universe.profiles import REQUIRED_RELEASE_ARTIFACTS

          release_id = os.environ['RELEASE_ID']
          release = Path(os.environ['RELEASE_DIR'])
          evidence = Path(os.environ['EVIDENCE_DIR'])
          if not release.is_dir():
              raise SystemExit(f'materialized release directory is missing: {release}')

          missing = [name for name in REQUIRED_RELEASE_ARTIFACTS if not (release / name).is_file()]
          if missing:
              raise SystemExit('release is incomplete: ' + ', '.join(missing))

          manifest = json.loads((release / 'data_release_manifest.json').read_text(encoding='utf-8'))
          research = json.loads((release / 'research_release_manifest.json').read_text(encoding='utf-8'))
          if manifest.get('release_id') != release_id or research.get('release_id') != release_id:
              raise SystemExit('release ID does not match both manifests')

          completion = evidence / f'completion_audit_{release_id}.md'
          invariant = evidence / f'research_invariant_validation_{release_id}.json'
          if not completion.is_file() or not invariant.is_file():
              raise SystemExit('required completion/research-invariant evidence is missing')
          invariant_payload = json.loads(invariant.read_text(encoding='utf-8'))
          if invariant_payload.get('status') != 'PASS' or invariant_payload.get('failure_count') not in (0, None):
              raise SystemExit('research invariant validation is not PASS')
          PY

      - name: Verify release hashes before publication
        env:
          RELEASE_DIR: ${{ inputs.release_dir }}
        run: python scripts/validate_release_manifest_hashes.py --release "$RELEASE_DIR"

      - name: Build immutable GitHub storage package
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_DIR: ${{ inputs.release_dir }}
          EVIDENCE_DIR: ${{ inputs.evidence_dir }}
        run: |
          rm -rf /tmp/phase3-github-package
          mkdir -p /tmp/phase3-github-package/release /tmp/phase3-github-package/evidence
          cp -a "$RELEASE_DIR"/. /tmp/phase3-github-package/release/
          find "$EVIDENCE_DIR" -maxdepth 1 -type f \
            \( -name "*${RELEASE_ID}*" -o -name 'data_source_coverage.md' -o -name 'raw_integrity_audit.md' \) \
            -exec cp {} /tmp/phase3-github-package/evidence/ \;
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/phase3-github-package')
          rows = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              rows.append({
                  'path': path.relative_to(root).as_posix(),
                  'bytes': path.stat().st_size,
                  'sha256': digest.hexdigest(),
              })
          (root / 'github_storage_manifest.json').write_text(
              json.dumps({'contract': 'phase3-github-storage-v1', 'files': rows}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          tar -czf "/tmp/${RELEASE_ID}-complete.tar.gz" -C /tmp/phase3-github-package .
          sha256sum "/tmp/${RELEASE_ID}-complete.tar.gz" > "/tmp/${RELEASE_ID}-complete.tar.gz.sha256"
          # GitHub Release assets are bounded in size. Always split so the same
          # path works for small and large canonical releases.
          split -b 1900m -d -a 3 \
            "/tmp/${RELEASE_ID}-complete.tar.gz" \
            "/tmp/${RELEASE_ID}-complete.tar.gz.part-"
          sha256sum /tmp/"${RELEASE_ID}"-complete.tar.gz.part-* \
            > "/tmp/${RELEASE_ID}-complete.parts.sha256"

      - name: Create immutable canonical GitHub Release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release tag: $RELEASE_ID" >&2
            exit 1
          fi
          gh release create "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_ID" \
            --notes "Canonical Phase 3 downstream handoff. The complete audited release directory and audit evidence are stored as immutable GitHub Release assets. Verify the part hashes, reconstructed archive hash, github_storage_manifest.json, and both release manifests before consumption."
          gh release upload "$RELEASE_ID" \
            /tmp/"${RELEASE_ID}"-complete.tar.gz.part-* \
            "/tmp/${RELEASE_ID}-complete.parts.sha256" \
            "/tmp/${RELEASE_ID}-complete.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish directly consumable downstream artifacts
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_DIR: ${{ inputs.release_dir }}
        run: |
          for name in \
            data_release_manifest.json \
            research_release_manifest.json \
            partitioned_artifacts_manifest.json \
            security_master.parquet \
            symbol_history.parquet \
            isin_history.parquet \
            company_name_history.parquet \
            issuer_master.parquet \
            listing_episodes.parquet \
            trading_calendar.parquet \
            trading_status_intervals.parquet \
            research_universe_monthly.parquet \
            required_research_security.parquet; do
            test -f "$RELEASE_DIR/$name"
            gh release upload "$RELEASE_ID" "$RELEASE_DIR/$name" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify GitHub round trip
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          rm -rf /tmp/phase3-roundtrip
          mkdir -p /tmp/phase3-roundtrip
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${RELEASE_ID}-complete*" \
            --dir /tmp/phase3-roundtrip
          cd /tmp/phase3-roundtrip
          sha256sum -c "${RELEASE_ID}-complete.parts.sha256"
          cat "${RELEASE_ID}"-complete.tar.gz.part-* > "${RELEASE_ID}-complete.tar.gz"
          sha256sum -c "${RELEASE_ID}-complete.tar.gz.sha256"
          mkdir unpacked
          tar -xzf "${RELEASE_ID}-complete.tar.gz" -C unpacked
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/phase3-roundtrip/unpacked')
          manifest = json.loads((root / 'github_storage_manifest.json').read_text(encoding='utf-8'))
          if manifest.get('contract') != 'phase3-github-storage-v1':
              raise SystemExit('unexpected GitHub storage contract')
          for row in manifest['files']:
              path = root / row['path']
              if not path.is_file() or path.stat().st_size != row['bytes']:
                  raise SystemExit(f'missing/size mismatch after GitHub round trip: {row["path"]}')
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              if digest.hexdigest() != row['sha256']:
                  raise SystemExit(f'hash mismatch after GitHub round trip: {row["path"]}')
          print(f'verified {len(manifest["files"])} files from GitHub Release storage')
          PY
