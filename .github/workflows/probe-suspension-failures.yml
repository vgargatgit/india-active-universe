name: probe-suspension-failures

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e '.[data,dev]'
      - name: Run focused suspension collector tests
        run: pytest -q tests/test_collect_nse_suspension_evidence.py
      - name: Collect official suspension evidence
        run: |
          set -euo pipefail
          rm -rf /tmp/suspension-probe
          mkdir -p /tmp/suspension-probe
          python scripts/collect_nse_suspension_evidence.py \
            --raw-dir /tmp/suspension-probe/raw \
            --out /tmp/suspension-probe/suspension_events.parquet \
            --start 2006-01-01 --end 2026-08-10 | tee /tmp/suspension-probe/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/suspension-probe/raw/source_manifest.json').read_text())
          failed=[row for row in manifest if str(row.get('download_status','')).startswith('FAILED:')]
          pdf=[row for row in manifest if row.get('media_type') == 'application/pdf']
          assert not failed, failed
          assert pdf, 'expected at least one official legacy PDF notice'
          print(json.dumps({'manifest_rows':len(manifest),'pdf_sources':len(pdf),'failed_sources':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: suspension-source-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/suspension-probe/
          retention-days: 7
          if-no-files-found: error
