name: probe-suspension-failures

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe suspension-related legacy NSE press sources
        run: |
          python - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          ARCHIVE='https://www.nseindia.com/static/resources/exchange-communication-press-releases-archives'
          HEADERS={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 india-active-universe/0.1',
              'Accept':'text/html,application/xhtml+xml,application/pdf',
              'Accept-Language':'en-US,en;q=0.9',
          }
          KEYWORDS=re.compile(r'suspension|suspended|revocation|recommencement|available\s+for\s+trading', re.I)
          LINK=re.compile(r'href=["\']([^"\']*/content/press/(\d{2})(\d{2})(\d{4})\.(?:htm|pdf)(?:\?[^"\']*)?)["\']', re.I)

          def get(url, attempts=1):
              last=None
              for attempt in range(attempts):
                  try:
                      req=urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=12) as response:
                          content=response.read()
                          ctype=response.headers.get('Content-Type','')
                          final=response.geturl()
                      if not content:
                          raise ValueError('empty response')
                      return {'ok':True,'final_url':final,'bytes':len(content),'content_type':ctype}
                  except Exception as exc:
                      last=f'{type(exc).__name__}: {exc}'
                      if attempt + 1 < attempts:
                          time.sleep(min(2.0, 0.5 * (2 ** attempt)))
              return {'ok':False,'error':last}

          req=urllib.request.Request(ARCHIVE, headers=HEADERS)
          with urllib.request.urlopen(req, timeout=30) as response:
              body=response.read().decode('utf-8', errors='replace')

          matches=list(LINK.finditer(body))
          candidates=[]
          for index, match in enumerate(matches):
              href, dd, mm, yyyy=match.groups()
              date=f'{yyyy}-{mm}-{dd}'
              if not ('2006-01-01' <= date <= '2026-08-10'):
                  continue
              end=matches[index+1].start() if index+1 < len(matches) else min(len(body), match.end()+6000)
              segment=body[match.start():end]
              text=html.unescape(re.sub(r'<[^>]+>', ' ', segment))
              text=re.sub(r'\s+', ' ', text).strip()
              if not KEYWORDS.search(text):
                  continue
              url=urllib.parse.urljoin(ARCHIVE, href)
              if url not in {row['source_url'] for row in candidates}:
                  candidates.append({'source_url':url,'date':date,'archive_summary':text[:1000]})

          def verify(row):
              url=row['source_url']
              primary=get(url,2)
              parsed=urllib.parse.urlsplit(url)
              alt_host='www.nseindia.com' if parsed.netloc == 'nsearchives.nseindia.com' else 'nsearchives.nseindia.com'
              alternate=urllib.parse.urlunsplit((parsed.scheme,alt_host,parsed.path,parsed.query,parsed.fragment))
              alt=get(alternate,2) if not primary['ok'] else None
              result=dict(row)
              result.update({'primary':primary,'alternate_url':alternate,'alternate':alt})
              return result

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              checked=list(pool.map(verify,candidates))
          failed=[row for row in checked if not row['primary']['ok'] and not (row['alternate'] and row['alternate']['ok'])]
          recovered=[row for row in checked if not row['primary']['ok'] and row['alternate'] and row['alternate']['ok']]
          print(json.dumps({
              'archive_press_links':len(matches),
              'suspension_related_candidates':len(candidates),
              'recovered_by_alternate_host':recovered,
              'failed_count':len(failed),
              'failed_sources':failed,
          },indent=2,sort_keys=True))
          PY
