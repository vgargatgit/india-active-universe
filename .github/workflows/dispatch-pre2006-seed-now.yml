name: dispatch-pre2006-seed-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pre2006-seed-now.yml'

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch and report 2004-2005 raw seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run archive-nse-bhavcopy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f start_date=2004-01-01 \
            -f end_date=2005-12-31
          sleep 8
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/archive-nse-bhavcopy.yml/runs?event=workflow_dispatch&branch=main&per_page=10" --jq '.workflow_runs[0].id')"
          if [ -z "$run_id" ]; then
            echo 'Pre-2006 archive dispatch succeeded but run ID could not be resolved.' >&2
            exit 1
          fi
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "2004-2005 durable NSE raw seed started: Actions run ${run_id}. This is the only raw-year gap found by recovery run 32325729011."
          echo "PRE2006_SEED_RUN_ID=${run_id}"
